# S3 user message blocks, in this order. A block is left out entirely (header and how-to-use text) when its
# switch is off; when it is on but has no value, its `empty` line is used instead of the body.
order:
  header: "[이번 주문]"
  how: '물건마다 "종류 × 수량 [속성]"이다. 수량 "모름"은 주문 화면에 수량이 보이지 않았다는 뜻이다.'
order_time:
  header: "[주문 시각]"
  line: "{MONTH}월 {DAY}일 ({WEEKDAY}) {HH}:{MM}에 공유됨"
household:
  header: "[이 집 가구 유형]"
  how: '이 집이 온보딩에서 고른 값이다. "누가"의 참고일 뿐 이번 주문의 근거가 아니다.'
  # empty -> block omitted
unusual:
  header: "[이 집 지난 90일 주문과 비교]"
  how: "평소와 다른 물건만 이유와 함께 적었다. 다르다는 것은 의도의 후보일 뿐이다."
  usual_line: "나머지({ITEMS})는 이 집이 평소 사는 물건이다."
  empty_insufficient: "이 집 주문 기록이 10개 미만이라 비교하지 않음"
  empty_all_usual: "이번 물건은 모두 이 집이 평소 사는 물건이다."
calendar:
  header: "[캘린더 일정]"
  how: '공유 시각부터 14일 안의, 행사 태그가 붙은 일정이다. "며칠 뒤"는 공유한 날 기준이다.'
  line: "- {ID} · {DAYS}일 뒤 {WEEKDAY} {START}~{END} · {TAGS}"
  empty: "14일 안에 행사 태그가 붙은 일정 없음"
kb:
  header: "[비슷한 다른 집 주문]"
  how: |-
    이 사례들을 주는 이유: 너는 말은 되지만 실제 사람들은 잘 하지 않는 해석을 고르기 쉽다. 아래는 이번 주문과 물건이 많이 겹치는 다른 집 주문을 모아, 그런 주문이 어떤 목적이었는지 센 것이다. 보통 사람이 할 법한 해석에서 크게 벗어나지 않게 하는 기준으로 쓴다.
    읽는 법:
    - "평소"는 전체 사례에서 그 목적이 차지하는 비율이다. 어떤 목적이 비슷한 주문에서 평소보다 많이 나왔다면, 이번 주문의 물건이 그 목적과 관련 있다는 근거다.
    - 의도 없음은 평소에도 많다. 비슷한 주문에 의도 없음이 많아도 평소만큼이면 근거가 아니다. 평소보다 적으면 이번 주문에 목적이 있을 가능성이 높다.
    쓰는 법:
    - 먼저 이름표 정의의 구분 단서로 가른다 (예: 초·파티 소품이 없으면 생일 파티가 아니다). 그래도 둘 이상이 맞을 때만 평소보다 많이 나온 해석을 고른다.
    - 건수가 작으면(예: 1~2건) 평소보다 비율이 높아도 근거로 약하다. 물건을 더 믿는다.
    - 겹치는 물건이 적은 예시는 이번 주문과 덜 닮았다. 이번 주문에만 있는 물건이 다른 해석을 분명히 가리키면 그 물건이 우선이다.
    쓰지 않는 법:
    - 예시의 인원·테마·활동·요일과 의도 문장의 표현은 그 집의 일이다. 이번 주문의 칸으로 옮기지 않는다.
    - 비율만 보고 정하지 않는다. 의도는 언제나 이번 주문의 물건이 받쳐야 한다.
  counts: "비슷한 주문 {N}건: {COUNTS}"          # without base rates (tests, old contexts)
  counts_header: "비슷한 주문 {N}건 (전체 {TOTAL}건 중):"
  count_line: "- {NAME} {N}건 · 이번 {SHARE} · 평소 {BASE}"     # "- 아이 생일 파티 7건 · 이번 58% · 평소 2%"
  example: |-
    예시 {I} · {NAME} ({INTENT_ID})
      이번 주문과 겹치는 물건: {N}개 중 {K}개 ({OVERLAP})
      물건: {ITEMS}
      의도 문장: {INTENT_TEXT}
      상황: event {EVENT} · guests {GUESTS} · activity {ACTIVITY} · theme {THEME}
      일정 태그: {TAGS} · 그 집 가구 유형: {TYPES}
  few: "이번 주문과 비슷한 다른 집 주문이 거의 없다 ({N}건). 흔한 해석을 알려 줄 근거가 없으니 물건만 보고 판단하고, 확신이 낮으면 의도 없음으로 둔다."
none_word: "없음"        # empty situation field / tags in examples
unknown_qty: "모름"
