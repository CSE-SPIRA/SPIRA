# Commands the server allows per way (server/spec.md §11.1). Anything else is dropped `unsafe_cmd`.
# The hub's delegation (`never`) is checked as well; this list never widens it.
run: [clean, color, color_temp, brightness, play_mood, ai_wallpaper, play, play_music, volume, off, child_lock, mode, super_freeze, temperature, wind_strength, power_save, position]
standby_pattern: "^set_[a-z0-9_]*_standby$"
notice: [show_notice]
deny_words: [start, ignite, heat, unlock, open, buy, order, pay, delete, reset]
# Safety actions: a task with any of these is sent protective (released only on an observed end).
protective: ["*.child_lock", "smart_plug.off"]
