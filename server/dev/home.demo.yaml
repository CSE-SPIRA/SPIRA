  - {days_ago: 53, items: [{type: 우유, qty: 1, label: care}, {type: 주방 세제, qty: 1}]}
  - {days_ago: 59, items: [{type: 우유, qty: 1, label: care}, {type: 계란, qty: 1, label: care}]}
