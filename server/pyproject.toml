[project]
name = "spira-server"
version = "0.1.0"
description = "SPIRA Server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "apscheduler>=3.10,<4",
  "pyyaml>=6",
  "jsonschema>=4.23",
  "referencing>=0.35",
  "anthropic>=0.40",
  "openai>=1.50",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
# BGE-M3 embedding (spec §3.2, KB-16). Not needed with EMBED_MODE=mock.
# Pinned to the default branch until SPIRA_KB tags kb-v1; then pin @kb-v1.
embed = ["spira-kb[embed] @ git+https://github.com/CSE-SPIRA/SPIRA_KB"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spira_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]   # environment is set before the app imports
