<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SPIRA household stage</title>
  <link rel="stylesheet" href="/sim/style.css">
  <script defer src="/sim/stage.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Household stage</h1>
      <p id="connection" role="status">Waiting for a World observation…</p>
    </header>
    <section id="rooms" class="rooms" aria-label="Observed rooms"></section>
    <section class="overlays" aria-label="Plan and restore overlays">
      <section class="planned">
        <h2>Planned preparation</h2>
        <ul id="preparation"></ul>
        <h3>Item notices</h3>
        <ul id="notices"></ul>
        <p id="plan-status" role="status"></p>
      </section>
      <section class="restore">
        <h2>Hub restore reports</h2>
        <ul id="restores"></ul>
      </section>
    </section>
  </main>
</body>
</html>
