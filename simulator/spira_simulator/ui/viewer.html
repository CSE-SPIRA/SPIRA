<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>테스트 홈 · {{ home }}</title>
  <link rel="stylesheet" href="/sim/style.css">
  <script defer src="/sim/stage.js"></script>
</head>
<body class="test-home">
  <main>
    <header class="home-heading">
      <h1>테스트 홈 · {{ home }} <small>({{ household_id }})</small></h1>
      {% if peers %}
      <nav aria-label="집 바꾸기">
        {% for label, url in peers %}<a href="{{ url }}">{{ label }}</a>{% endfor %}
      </nav>
      {% endif %}
    </header>
    <p id="connection-lost" class="observation-warning" role="status" hidden>연결 끊김 · 마지막 관찰값</p>
    {% include "home.html" %}
  </main>
</body>
</html>
