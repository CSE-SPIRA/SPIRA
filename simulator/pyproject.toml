[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "spira-simulator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "paho-mqtt>=2.1,<3",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.18,<1",
  "pyyaml>=6,<7",
  "spira-contracts==0.1.0",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["spira_simulator*"]

[tool.setuptools.package-data]
spira_simulator = ["profiles/*.json", "ui/*", "ui/demo/*", "ui/house/*", "ui/house/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["provisional: depends on the Class A assumption pending PQ-01"]
